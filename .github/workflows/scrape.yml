name: Multi-Company Jobs Notifier

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      companies:
        description: Comma-separated company slugs to scrape
        required: false
        default: amazon,apple,google,meta,lyft,salesforce,goldman-sachs,cvs,cvs_wd,uber

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Run scraper
        id: run_scraper
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMPANIES: ${{ inputs.companies || 'amazon,apple,google,meta,lyft,salesforce,goldman-sachs,cvs,cvs_wd,uber' }}
        run: python scraper.py

      - name: Upload scraper diagnostics
        if: steps.run_scraper.outcome == 'failure' && hashFiles('artifacts/**') != ''
        uses: actions/upload-artifact@v5
        with:
          name: scraper-diagnostics
          path: artifacts/
          if-no-files-found: ignore

      - name: Commit updated seen-job files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f seen_jobs
          if git diff --cached --quiet; then
            echo "No seen_jobs changes to commit."
            exit 0
          fi
          git commit -m "chore: update seen jobs [skip ci]"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
